{% extends "base.html" %}
{% block title %}Documents | Harborline Bank{% endblock %}
{% block content %}<section class="simple-page"><p class="eyebrow">Personal banking / Documents</p><h1>Share a document.</h1><p>Files are acknowledged for this demo and are not saved to an account.</p><form method="post" enctype="multipart/form-data" class="bank-form upload-form"><label for="document">Choose a file</label><input id="document" type="file" name="file" required><button class="button button-dark" type="submit">Upload document</button></form>{% if filename %}<p class="form-success" role="status">Received: <strong>{{ filename }}</strong></p>{% endif %}</section>{% endblock %}
