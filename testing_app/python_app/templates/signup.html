{% extends "base.html" %}
{% block title %}Create Account — Harborline Bank{% endblock %}
{% block content %}
<section class="glass-panel" style="max-width:420px; margin:3rem auto;">
  <h2>Open an Account</h2>
  <p class="text-muted" style="margin-bottom:1.5rem;">Join thousands of customers banking with Harborline.</p>
  <form method="POST">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="you@email.com" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="Min 6 characters" required>
    </div>
    <button class="btn-primary" style="width:100%;" type="submit">Create Account</button>
  </form>
  <p style="margin-top:1rem; text-align:center; color:var(--text-muted);">Already have an account? <a href="{{ url_for('login') }}" style="color:var(--primary);">Sign in</a></p>
</section>
{% endblock %}
